name: Release Check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check changelog
        run: npm run changelog:check

      - name: Build package tarball
        run: npm pack --json

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: repo-ready-check-*.tgz
